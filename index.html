<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thamizhans TZ Studios</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Outfit:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090a;--paper:#10151299;--card:#111713;--ink:#f3f1e8;--mute:#9aa69d;--acc:#ff8a1f;--grn:#2bd44a;--on:#111;--line:#ffffff1f;--glass:#0a0d0bb3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2f5ee;--paper:#ffffffcc;--card:#fff;--ink:#0f1a14;--mute:#5a665e;--acc:#e86f00;--grn:#0f8a2b;--line:#0f1a1424;--glass:#ffffffcc}}
:root[data-theme="light"]{--bg:#f2f5ee;--paper:#ffffffcc;--card:#fff;--ink:#0f1a14;--mute:#5a665e;--acc:#e86f00;--grn:#0f8a2b;--line:#0f1a1424;--glass:#ffffffcc}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 'Outfit','Noto Sans Tamil',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(700px 480px at 0% 0%,#ff8a1f30,transparent 70%),radial-gradient(700px 480px at 100% 100%,#2bd44a30,transparent 70%)}
h1,h2,h3,.tw{font-family:'Permanent Marker','Noto Sans Tamil',sans-serif;font-weight:400;line-height:1.25;margin:0}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 5vw 0;padding:8px 10px 8px 16px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);max-width:1180px;margin-inline:max(5vw,calc((100vw - 1180px)/2))}
header .brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:400 15px 'Permanent Marker',sans-serif}
header img{height:44px;width:auto;max-width:120px;object-fit:contain}
nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav a{padding:8px 15px;text-decoration:none;border-radius:999px;font-weight:500}
nav a:hover{background:var(--line)}nav a.on{background:var(--line);color:var(--acc)}
nav a[data-r=admin]{background:linear-gradient(90deg,var(--acc),var(--grn));color:#111;font-weight:600}
main{max-width:1180px;margin:0 auto;padding:18px 5vw 60px}
.hero{position:relative;border-radius:28px;overflow:hidden;min-height:clamp(260px,46vw,520px);background:#000 center/cover no-repeat;display:flex;align-items:flex-end;border:1px solid var(--line)}
.shade{position:absolute;inset:0;background:linear-gradient(0deg,#000d 0%,#0000 60%)}
.feat{position:relative;margin:18px;padding:20px;border-radius:22px;max-width:440px;background:#0a0d0bb3;color:#f3f1e8;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #ffffff2a}
.feat h2{font-size:clamp(18px,2.6vw,26px);margin:10px 0 6px}.feat p{margin:0 0 14px;color:#c9d2cb}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;background:linear-gradient(90deg,var(--acc),var(--grn));color:#111;font-weight:700;font-size:13px}
.btn{display:inline-block;background:var(--acc);color:var(--on);border:2px solid var(--acc);padding:9px 20px;cursor:pointer;text-decoration:none;font-weight:700;border-radius:999px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.alt{background:transparent;color:inherit;border-color:currentColor;opacity:.9}
.btn.sm{padding:4px 12px;font-size:14px}
.bento{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:16px 0 34px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px 18px;color:var(--mute);backdrop-filter:blur(10px)}
.tile b{display:block;font:400 30px 'Permanent Marker',sans-serif;color:var(--ink)}
.tile.wide{grid-column:span 2;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:linear-gradient(120deg,#ff8a1f33,#2bd44a33);color:var(--ink);font-weight:600}
.row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 18px;margin-bottom:14px}
.row .card{flex:0 0 min(290px,78vw);scroll-snap-align:start}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 22px}
.bar input,.bar select,.f input,.f select,.f textarea{padding:10px 14px;background:var(--paper);border:1px solid var(--line);min-width:0;border-radius:14px}
.bar input{flex:1 1 220px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);cursor:pointer;text-align:left;padding:0;display:block;width:100%;border-radius:20px;overflow:hidden;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:var(--acc)}
.th{position:relative;aspect-ratio:16/9;background:#0a0c0a;color:#f3f1e8;display:flex;align-items:center;justify-content:center;font:400 20px 'Permanent Marker',sans-serif;background-size:cover;background-position:center}
.th b{font-weight:600;background:linear-gradient(90deg,var(--acc),var(--grn));-webkit-background-clip:text;background-clip:text;color:transparent}
.play{position:absolute;right:12px;bottom:12px;width:40px;height:40px;border-radius:50%;background:var(--acc);opacity:0;transform:scale(.8);transition:.2s}
.play::after{content:"";position:absolute;left:15px;top:11px;border:9px solid transparent;border-left:14px solid #111}
.card:hover .play{opacity:1;transform:none}
.chip{position:absolute;left:10px;top:10px;padding:2px 10px;border-radius:999px;background:#000a;color:#fff;font-size:12px}
.cb{padding:12px 16px 16px}.cb h3{font-size:15px;margin-bottom:6px}
.meta{font-size:13px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap}
.tag{color:var(--grn);font-weight:600;font-size:13px}
h2.sec{font-size:clamp(18px,3vw,26px);margin:0 0 16px}
.empty{padding:40px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:20px}
dialog{border:1px solid var(--line);padding:0;max-width:860px;width:94vw;background:var(--card);color:var(--ink);border-radius:24px;overflow:hidden}
dialog::backdrop{background:#000c;backdrop-filter:blur(6px)}
.vid{aspect-ratio:16/9;background:#000}.vid iframe{width:100%;height:100%;border:0}
.dp{padding:16px 22px 24px}
.admin .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.admin .tabs button{padding:8px 16px;background:var(--paper);border:1px solid var(--line);cursor:pointer;border-radius:999px}
.admin .tabs button.on{background:var(--grn);color:#111;border-color:var(--grn);font-weight:600}
.f{display:grid;gap:12px;background:var(--paper);padding:20px;border:1px solid var(--line);margin-bottom:22px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));border-radius:22px}
.f label{display:grid;gap:4px;font-size:14px;font-weight:600}.f .w{grid-column:1/-1}
.tw-wrap{overflow-x:auto;border-radius:18px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;background:var(--paper);min-width:560px}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px}.stat b{display:block;font:400 30px 'Permanent Marker',sans-serif;color:var(--acc)}
.bv{height:10px;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--grn));min-width:4px}
footer{padding:24px 5vw;text-align:center;color:var(--mute);font-size:14px}
.note{font-size:13px;color:var(--mute)}
@media(prefers-reduced-motion:no-preference){.feat{animation:up .7s ease-out}@keyframes up{from{opacity:0;transform:translateY(16px)}}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.chip2{padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer}.chip2.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}.catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:34px}.catc{text-align:left;padding:22px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(135deg,#ff8a1f2e,#2bd44a2e),var(--card);cursor:pointer;display:grid;gap:4px;transition:transform .2s}.catc:hover{transform:translateY(-3px);border-color:var(--acc)}.catc b{font:400 18px 'Permanent Marker',sans-serif}.catc span{color:var(--mute)}

body{overflow-x:hidden}
header{top:env(safe-area-inset-top,0px);margin:0;max-width:none;border-radius:0;padding:10px max(5vw,calc((100vw - 1180px)/2));background:#07080a;backdrop-filter:none;-webkit-backdrop-filter:none;border:0;border-bottom:2px solid;border-image:linear-gradient(90deg,#ff8a1f,#2bd44a) 1;color:#f3f1e8}
nav a{border-radius:0}nav a.on{background:none;color:#ff8a1f}nav a[data-r=admin]{background:none;color:inherit;font-weight:500}
.btn{border-radius:2px}
.hero{min-height:0;aspect-ratio:2560/820;background-size:100% 100%;margin-bottom:8px}
.hero2{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding:56px max(5vw,calc((100vw - 1180px)/2));margin:-18px calc(50% - 50vw) 28px;min-height:min(78vh,640px);background:radial-gradient(800px 500px at 80% 40%,#ff8a1f26,transparent 70%),radial-gradient(700px 500px at 10% 100%,#2bd44a22,transparent 70%),#07080a;color:#f3f1e8;overflow:hidden}
.hero2 canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero2 .tx,.hero2 .lg{position:relative}
.hero2 h1{font-size:clamp(34px,6.2vw,76px);line-height:1.1}
.hero2 h1 em{font-style:normal;display:block;background:linear-gradient(90deg,#ff8a1f,#ffd24a,#2bd44a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero2 p{max-width:46ch;color:#cfd6d0;font-size:18px;margin:18px 0 26px}
.hero2 .btn.alt{border-color:#fff;color:#fff}
.hero2 .lg img{width:100%;max-width:460px;margin:auto;display:block;filter:drop-shadow(0 0 40px #ff8a1f55)}
@media(max-width:820px){.hero2{grid-template-columns:1fr}.hero2 .lg{order:-1;max-width:240px;margin:auto}}
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#1c1408,#07080a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;color:#f3f1e8;transition:opacity .6s;padding:20px}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:min(340px,70vw);filter:drop-shadow(0 0 40px #ff8a1f66)}
#splash p{color:#9aa69d;margin:0}#splash a{color:#c9d2cb}
.btn.big{font:400 22px 'Permanent Marker',cursive;padding:14px 44px;border-color:#2bd44a;outline:3px solid #ff8a1f55;outline-offset:3px}
.snd{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;padding:10px 22px;border-radius:999px;border:2px solid var(--acc);background:#07080acc;color:#f3f1e8;cursor:pointer;font-weight:600}
.snd[hidden]{display:none}

.hero2{min-height:calc(100svh - 66px);grid-template-columns:1fr 1fr;margin-bottom:34px}
.hero2 h1{font-size:clamp(40px,7vw,92px);line-height:1.08;color:#fff}
.hero2 h1 em{background-image:linear-gradient(90deg,#ff8a1f,#ffd24a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding-bottom:.1em}
.hero2 p{font-size:19px;max-width:44ch}
.hero2 .btn{padding:20px 32px;font-size:18px;font-weight:600}
.hero2 .lg img{max-width:580px}
.scr{position:absolute;left:50%;bottom:0;width:2px;height:30px;background:var(--acc)}
@media(prefers-reduced-motion:no-preference){.scr{animation:scr 1.8s ease-in-out infinite}@keyframes scr{50%{height:12px;opacity:.5}}}
header .brand span{display:none}header img{height:50px;max-width:150px}
#splash img{width:min(580px,84vw)}
.btn.big{background:#1fa83a;color:#fff;border:3px solid #ffd24a;outline:0;padding:20px 52px;font-size:24px}
.hero{margin-top:30px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;z-index:300;font-weight:600}.cfm{position:fixed;inset:0;z-index:250;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px}.cfm .box{background:var(--card);padding:24px;border-radius:18px;border:1px solid var(--line);max-width:360px;text-align:center}.cfm p{margin:0 0 16px}.f [hidden],nav a[hidden]{display:none}
footer .soc{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}footer .btn.alt{color:var(--ink)}footer p{margin:0}
#acct{padding:8px 16px;color:#f3f1e8;border-color:#f3f1e8}#acct[hidden]{display:none}
</style>

function sha256(a){function rr(v,n){return(v>>>n)|(v<<(32-n))}var mp=Math.pow,mw=mp(2,32),i,j,res='',words=[],bl=a.length*8,hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,comp={};for(var c=2;pc<64;c++){if(!comp[c]){for(i=0;i<313;i+=c)comp[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}a+='\x80';while(a.length%64-56)a+='\x00';for(i=0;i<a.length;i++){j=a.charCodeAt(i);if(j>>8)return'';words[i>>2]|=j<<((3-i)%4)*8}words[words.length]=((bl/mw)|0);words[words.length]=bl;for(j=0;j<words.length;){var w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],A=hash[0],E=hash[4],t1=hash[7]+(rr(E,6)^rr(E,11)^rr(E,25))+((E&hash[5])^((~E)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0),t2=(rr(A,2)^rr(A,13)^rr(A,22))+((A&hash[1])^(A&hash[2])^(hash[1]&hash[2]));hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}return res}

function setSess(j){const o={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000-60000,email:((j.user&&j.user.email)||'').toLowerCase()};try{localStorage.setItem(K+'s',JSON.stringify(o))}catch(e){}return o}
async function startSess(o){TOK=o.at;USER={email:o.email};try{const r=await fetch(SB_URL+'/rest/v1/admins?email=eq.'+encodeURIComponent(o.email)+'&select=role',{headers:H(TOK)});const j=await r.json();ROLE=(Array.isArray(j)&&j[0]&&j[0].role)||''}catch(e){ROLE=''}route()}
async function fresh(){const o=sess();if(o&&o.exp<=Date.now()&&o.rt){const{r,j}=await authCall('token?grant_type=refresh_token',{refresh_token:o.rt});if(r.ok&&j.access_token)TOK=setSess(j).at;else signOut(true)}}
async function restore(){const o=sess();if(!o)return;if(o.exp>Date.now())return startSess(o);if(o.rt){const{r,j}=await authCall('token?grant_type=refresh_token',{refresh_token:o.rt});if(r.ok&&j.access_token)return startSess(setSess(j))}signOut(true)}

async function initCaps(){if(typeof claude=='undefined')return;try{const u=await claude.use('user');if(u)isAdm=!!(await u.canEdit()||await u.isOwner())}catch(e){}try{AS=await claude.use('assets')}catch(e){}try{DB=await claude.use('db')}catch(e){}if(DB){try{DB.doc('site/main').onSnapshot(sn=>{const d=sn.exists&&sn.data();if(d&&d.json){try{S=JSON.parse(d.json)}catch(e){}route()}},()=>{})}catch(e){}}route()}
async function loadStatic(){if(sbOn())return sbLoad();try{if(localStorage.getItem(K+'d'))return}catch(e){}try{const r=await fetch('data.json',{cache:'no-store'});if(r.ok){const d=await r.json();if(d&&d.eps&&d.series&&d.brand){S=d;route()}}}catch(e){}}
async function ytSync(){const k=(S.brand.yk||'').trim(),ids=S.eps.map(e=>yid(e.url)).filter(Boolean).slice(0,50);if(!k||!ids.length)return;try{const j=await(await fetch('https://www.googleapis.com/youtube/v3/videos?part=statistics&id='+ids.join(',')+'&key='+encodeURIComponent(k))).json();(j.items||[]).forEach(it=>S.eps.filter(e=>yid(e.url)==it.id).forEach(e=>{e.ytViews=+it.statistics.viewCount||0}));route()}catch(e){}}
initCaps().then(loadStatic).then(ytSync);if(sbOn())hashLogin().then(restore);$('#acct').onclick=()=>{location.hash='#login'};

</script>
